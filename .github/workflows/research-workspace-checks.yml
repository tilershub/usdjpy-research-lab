name: Research workspace checks

on:
  pull_request:
    paths:
      - "website/**"
      - "terminal/**"
      - "templates/base.html"
      - "trade90/urls.py"
      - ".github/workflows/research-workspace-checks.yml"
  workflow_dispatch:

jobs:
  django-research-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-web.txt"
      - name: Install web dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Check Django configuration
        run: python manage.py check --settings=trade90.settings.dev
      - name: Test research workspace
        run: python manage.py test website.test_research_workspace terminal.test_intelligence terminal.test_live_quotes --settings=trade90.settings.dev --verbosity 2
