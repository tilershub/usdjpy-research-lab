name: Publish market research context
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_context.py'
      - 'retail_sentiment.py'
      - 'japan_statistics.py'
      - 'newsfeed.py'
      - 'economic_events.py'
      - 'positioning.py'
      - 'policy_expectations.py'
      - '.github/workflows/publish-research-context.yml'
  schedule:
    - cron: '35 * * * *'
permissions:
  contents: write
concurrency:
  group: research-context
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q test_research_context.py test_retail_sentiment.py test_japan_statistics.py test_newsfeed.py test_positioning.py
      - name: Fetch and validate independent research sources
        env:
          TRADING_ECONOMICS_KEY: ${{ secrets.TRADING_ECONOMICS_KEY }}
          MYFXBOOK_SESSION: ${{ secrets.MYFXBOOK_SESSION }}
          MYFXBOOK_DISPLAY_ALLOWED: ${{ vars.MYFXBOOK_DISPLAY_ALLOWED }}
        run: python research_context.py
      - name: Publish research context
        run: |
          git config user.name trade90-data-bot
          git config user.email actions@users.noreply.github.com
          git add public/research-context.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update sourced market research context"
          git pull --rebase
          git push
